    preguntas:
      - { pregunta: "¿Hace falta ser socio para reservar?", respuesta: "No. Cualquiera puede reservar pista. Los socios reservan con más antelación y pagan menos." }
      - { pregunta: "¿Alquiláis palas y bolas?", respuesta: "Sí, en recepción tienes palas de alquiler para todos los niveles y botes de bolas nuevas." }
      - { pregunta: "No he jugado nunca, ¿por dónde empiezo?", respuesta: "Con una clase de prueba en el grupo de iniciación. Te prestamos la pala y en una hora estarás jugando tus primeros puntos." }
